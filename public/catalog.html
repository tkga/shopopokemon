<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon GO Shop — สินค้าในสต๊อก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Kanit:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-scan: #0e1626;
    --surface: #121b2e;
    --surface-2: #17233a;
    --border: #253352;
    --red: #e3350d;
    --red-dim: #7a2413;
    --yellow: #ffcb05;
    --yellow-dim: #8a6c07;
    --green: #4cd97b;
    --green-dim: #1e5c3a;
    --text: #f2efe2;
    --text-dim: #8a93a6;
    --text-faint: #5a6478;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Kanit', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,203,5,0.06), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(227,53,13,0.07), transparent 45%);
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }

  header.top {
    position: sticky; top: 0; z-index: 20;
    background: rgba(11,18,32,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .brand-row { display: flex; align-items: center; gap: 10px; max-width: 1080px; margin: 0 auto; }
  .ball {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: linear-gradient(to bottom, var(--red) 0 48%, var(--surface) 48% 52%, var(--text) 52% 100%);
    border: 2px solid var(--surface-2);
    position: relative;
  }
  .ball::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
    background: var(--text); border-radius: 50%; transform: translate(-50%,-50%);
    border: 1.5px solid var(--surface);
  }
  h1.shop-name {
    font-family: 'Chonburi', 'Kanit', sans-serif;
    font-size: 19px;
    margin: 0;
    color: var(--yellow);
    letter-spacing: 0.3px;
  }
  .shop-sub { font-size: 11px; color: var(--text-faint); margin: 1px 0 0; letter-spacing: 1px; text-transform: uppercase; }

  .controls { max-width: 1080px; margin: 12px auto 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .search-box {
    flex: 1; min-width: 180px; position: relative;
  }
  .search-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: 'Kanit', sans-serif; font-size: 14px; padding: 10px 14px; border-radius: 10px;
    outline: none;
  }
  .search-box input::placeholder { color: var(--text-faint); }
  .search-box input:focus { border-color: var(--yellow-dim); }
  .toggle-stock {
    display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border); font-size: 13px; color: var(--text-dim);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .toggle-stock input { accent-color: var(--yellow); }
  .sort-select {
    padding: 0 12px; border-radius: 10px; height: 40px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: 'Kanit', sans-serif; font-size: 13px; cursor: pointer; outline: none;
  }
  .sort-select:focus { border-color: var(--yellow-dim); }

  .status-line {
    max-width: 1080px; margin: 14px auto 0; font-size: 12px; color: var(--text-faint);
    display: flex; justify-content: space-between; align-items: center;
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px;
    margin-top: 16px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .thumb {
    width: 100%; aspect-ratio: 1 / 1; background: var(--surface-2); position: relative; overflow: hidden;
  }
  .stamp-out {
    position: absolute; top: 50%; left: 50%; z-index: 2;
    transform: translate(-50%, -50%) rotate(-14deg);
    border: 4px double var(--red);
    border-radius: 6px;
    padding: 2px 14px;
    color: var(--red);
    font-family: 'Chonburi', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    background: rgba(11, 18, 32, 0.35);
    pointer-events: none;
    white-space: nowrap;
  }
  .stamp-out.small { font-size: 35px; padding: 4px 13px; border-width: 7px; }
  .modal-photo-wrap .stamp-out { font-size: 34px; padding: 4px 20px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.empty { display: flex; align-items: center; justify-content: center; }
  .thumb.empty::before {
    content: "?"; font-family: 'Chonburi', sans-serif; font-size: 30px; color: var(--text-faint);
  }
  .variant-pill {
    position: absolute; top: 8px; left: 8px; font-size: 10px; padding: 3px 8px; border-radius: 999px;
    background: rgba(11,18,32,0.82); color: var(--yellow); border: 1px solid var(--yellow-dim);
    letter-spacing: 0.3px;
  }
  .card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-name { font-size: 14px; font-weight: 500; line-height: 1.25; }
  /* ป้ายรหัสสินค้า (เช่น "รหัส A014") — ให้ลูกค้าคัดลอก/พิมพ์ส่งกลับมาแทนการแคปหน้าจอ+อธิบายเป็นคำ ๆ */
  .card-code { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--text-dim, #8a95ab); letter-spacing: 0.02em; }
  .card-price { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--yellow); }
  .qty-row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .qty-readout { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }
  .qty-in { color: var(--green); }
  .qty-out { color: var(--text-faint); }
  .qty-low { color: var(--yellow); }
  .qty-label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.5px; }
  .dots { display: flex; gap: 3px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); }
  .dot.on { background: var(--green); }
  .dot.on.low { background: var(--yellow); }

  .empty-state, .error-state, .loading-state {
    text-align: center; padding: 60px 20px; color: var(--text-dim);
  }
  .loading-state .scan {
    width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--yellow);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-state { color: var(--text-dim); }
  .error-state code {
    display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; margin-top: 10px; font-size: 11px; color: var(--text-faint); text-align: left;
    overflow-wrap: break-word;
  }

  .setup-panel {
    max-width: 480px; margin: 64px auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px;
  }
  .setup-panel h2 { font-family: 'Chonburi', sans-serif; font-size: 16px; color: var(--yellow); margin: 0 0 6px; }
  .setup-panel p { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin: 0 0 16px; }
  .setup-panel input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    font-family: 'Kanit', sans-serif; font-size: 13px; padding: 10px 12px; border-radius: 8px; outline: none;
    margin-bottom: 12px;
  }
  .setup-panel button {
    width: 100%; background: var(--red); color: #fff; border: none; padding: 11px; border-radius: 8px;
    font-family: 'Kanit', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .setup-panel button:active { transform: scale(0.98); }
  .setup-link {
    margin-top: 16px; padding: 12px; background: var(--surface-2); border-radius: 8px;
    font-size: 11px; word-break: break-all; color: var(--green);
  }
  .setup-link-label { font-size: 11px; color: var(--text-faint); margin-bottom: 6px; }

  .card { cursor: pointer; transition: border-color 0.15s; }
  .card:hover { border-color: var(--yellow-dim); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(6,10,18,0.82); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-sheet {
    width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-bottom: none;
    border-radius: 20px 20px 0 0; padding-bottom: 24px;
  }
  @media (min-width: 560px) {
    .modal-backdrop { align-items: center; }
    .modal-sheet { border-radius: 18px; border-bottom: 1px solid var(--border); }
  }
  .modal-close {
    position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(6,10,18,0.65); border: 1px solid var(--border); color: var(--text);
    font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .modal-photo-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--surface-2); }
  .modal-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-photo-wrap.empty { display: flex; align-items: center; justify-content: center; }
  .modal-photo-wrap.empty::before {
    content: "?"; font-family: 'Chonburi', sans-serif; font-size: 56px; color: var(--text-faint);
  }
  .modal-body { padding: 20px 22px 0; }
  .modal-variant-pill {
    display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,203,5,0.1); color: var(--yellow); border: 1px solid var(--yellow-dim);
    letter-spacing: 0.3px; margin-bottom: 10px;
  }
  .modal-name { font-family: 'Chonburi', sans-serif; font-size: 22px; color: var(--text); margin: 0 0 16px; }
  .modal-stat-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 0; border-top: 1px solid var(--border);
  }
  .modal-stat-label { font-size: 13px; color: var(--text-dim); }
  .modal-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .modal-stat-value.price { color: var(--yellow); }
  .modal-stat-value.modal-code { color: var(--text); letter-spacing: 0.03em; }
</style>
</head>
<body>

<header class="top">
  <div class="brand-row">
    <div class="ball" aria-hidden="true"></div>
    <div>
      <h1 class="shop-name" id="shopName">Pokémon GO Shop</h1>
      <p class="shop-sub">รายการสินค้า</p>
    </div>
  </div>
  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ค้นหา Pokémon..." autocomplete="off">
    </div>
    <label class="toggle-stock">
      <input type="checkbox" id="onlyInStock">
      เฉพาะที่มีของ
    </label>
    <select class="sort-select" id="typeSelect">
      <option value="">ทุกประเภท</option>
    </select>
    <select class="sort-select" id="sortSelect">
      <option value="trending">มาแรง</option>
      <option value="price_asc">ราคาน้อยไปมาก</option>
      <option value="price_desc">ราคามากไปน้อย</option>
    </select>
  </div>
  <div class="status-line" id="statusLine"></div>
</header>

<div class="wrap">
  <div id="root"></div>
</div>

<div id="modalRoot"></div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var sheetId = params.get('sheet') || localStorage.getItem('pgs_catalog_sheet_id') || '';

  if (!sheetId) {
    renderSetup();
    return;
  }

  localStorage.setItem('pgs_catalog_sheet_id', sheetId);
  loadCatalog(sheetId);

  function renderSetup() {
    var root = document.getElementById('root');
    root.innerHTML =
      '<div class="setup-panel">' +
        '<h2>ตั้งค่าหน้าแคตตาล็อก</h2>' +
        '<p>วาง Spreadsheet ID หรือลิงก์ Google Sheet ที่ร้านซิงค์ข้อมูลอยู่ (ต้องตั้งค่าแชร์เป็น "ทุกคนที่มีลิงก์ - ดูได้" ก่อน)</p>' +
        '<input type="text" id="sheetIdInput" placeholder="วาง Spreadsheet ID หรือลิงก์ Google Sheet">' +
        '<button id="saveSheetId">บันทึกและแสดงสินค้า</button>' +
        '<div id="linkOut"></div>' +
      '</div>';
    document.getElementById('saveSheetId').addEventListener('click', function () {
      var raw = document.getElementById('sheetIdInput').value.trim();
      var id = extractSheetId(raw);
      if (!id) { alert('รูปแบบ ID หรือลิงก์ไม่ถูกต้อง'); return; }
      var shareUrl = window.location.origin + window.location.pathname + '?sheet=' + id;
      var out = document.getElementById('linkOut');
      out.innerHTML =
        '<div class="setup-link-label">ลิงก์สำหรับแชร์ให้ลูกค้า (คัดลอกอันนี้ไปแชร์)</div>' +
        '<div class="setup-link">' + shareUrl + '</div>';
      localStorage.setItem('pgs_catalog_sheet_id', id);
      setTimeout(function () { window.location.search = '?sheet=' + id; }, 900);
    });
  }

  function extractSheetId(raw) {
    var m = raw.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if (m) return m[1];
    if (/^[a-zA-Z0-9-_]{20,}$/.test(raw)) return raw;
    return null;
  }

  // ดึงชีตใดๆ ในสเปรดชีตเดียวกันแบบ JSONP (ไม่ต้องมีสิทธิ์ CORS)
  // ถ้าล้มเหลว/หมดเวลา จะ resolve เป็น null แทนที่จะ throw — ให้ผู้เรียกตัดสินใจเองว่า
  // ชีตนี้จำเป็น (ต้อง error ทั้งหน้า) หรือเสริม (fallback เงียบๆ ได้ เช่น Orders สำหรับมาแรง)
  function fetchSheetJSON(id, sheetName, timeoutMs) {
    return new Promise(function (resolve) {
      var cbName = 'pgsCB_' + Math.random().toString(36).slice(2);
      var done = false;
      var timeoutId = setTimeout(function () {
        if (done) return; done = true; cleanup(); resolve(null);
      }, timeoutMs);
      window[cbName] = function (resp) {
        if (done) return; done = true; clearTimeout(timeoutId); cleanup(); resolve(resp);
      };
      var script = document.createElement('script');
      script.src = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(id) +
        '/gviz/tq?sheet=' + encodeURIComponent(sheetName) +
        '&tqx=out:json;responseHandler:' + cbName;
      script.onerror = function () {
        if (done) return; done = true; clearTimeout(timeoutId); cleanup(); resolve(null);
      };
      document.body.appendChild(script);
      function cleanup() { try { document.body.removeChild(script); } catch (e) {} delete window[cbName]; }
    });
  }

  // นับยอดขายต่อ "ชื่อสินค้า" จากชีต Orders เพื่อใช้เป็นตัวเรียง "มาแรง"
  // อ่านเฉพาะออเดอร์ประเภท sell_pokemon ที่ไม่ถูกยกเลิก คอลัมน์ "รายละเอียด" มีรูปแบบ
  // "ชื่อโปเกมอน xจำนวน" (ดู orderRow() ใน googleSync.js) — จับคู่ตาม "ชื่อ" เท่านั้น
  // (ไม่แยกชนิด/พันธุ์ เพราะข้อมูลออเดอร์ไม่ได้เก็บชนิดแยกไว้)
  function parseTrendingMap(table) {
    var map = {};
    if (!table || !table.rows) return map;
    table.rows.forEach(function (r) {
      var c = r.c || [];
      var val = function (i) { return c[i] && (c[i].v !== null && c[i].v !== undefined) ? c[i].v : ''; };
      var type = String(val(2) || '').trim();
      var cancelled = String(val(10) || '').trim();
      if (type !== 'sell_pokemon' || cancelled) return;
      var desc = String(val(5) || '').trim();
      var m = desc.match(/^(.*?)\s*x\s*(\d+)\s*$/i);
      var name = m ? m[1].trim() : desc;
      var qty = m ? (parseInt(m[2], 10) || 1) : 1;
      if (!name) return;
      map[name] = (map[name] || 0) + qty;
    });
    return map;
  }

  var trendingMap = {};

  function loadCatalog(id) {
    renderLoading();
    Promise.all([
      fetchSheetJSON(id, 'Stock', 10000),
      fetchSheetJSON(id, 'Orders', 10000)
    ]).then(function (results) {
      var stockResp = results[0];
      var ordersResp = results[1];
      if (!stockResp || !stockResp.table) {
        renderError('โหลดข้อมูลไม่สำเร็จ', 'ไม่พบชีต "Stock" หรือ Spreadsheet ID ไม่ถูกต้อง หรือยังไม่ได้เปิดสิทธิ์แชร์ (หมดเวลาหรือโหลดไม่สำเร็จ)');
        return;
      }
      try {
        var rows = parseTable(stockResp.table);
        // ชีต Orders โหลดไม่สำเร็จก็ไม่เป็นไร — แค่ "มาแรง" จะเรียงตามชื่อแทนแทนการนับยอดขาย
        trendingMap = ordersResp && ordersResp.table ? parseTrendingMap(ordersResp.table) : {};
        renderCatalog(rows);
      } catch (e) {
        renderError('อ่านข้อมูลไม่สำเร็จ', String(e && e.message || e));
      }
    });
  }

  function parseTable(table) {
    var rows = (table.rows || []).map(function (r) {
      var c = r.c || [];
      var val = function (i) { return c[i] && (c[i].v !== null && c[i].v !== undefined) ? c[i].v : ''; };
      return {
        name: String(val(1) || '').trim(),
        variant: String(val(2) || '').trim(),
        qty: Number(val(3)) || 0,
        threshold: val(4) === '' ? null : Number(val(4)),
        photoUrl: String(val(6) || '').trim(),
        price: Number(val(7)) || 0,
        // "รหัสสินค้า" (เช่น A014) ถูกเพิ่มเป็นคอลัมน์ที่ 9 (index 8) ต่อท้ายชีต Stock — ไม่แทรกกลาง
        // เพื่อไม่ให้ index คอลัมน์เดิม (โดยเฉพาะ "ลิงก์รูป" ที่อ่านที่ val(6)) เปลี่ยนตำแหน่ง
        // ชีตเก่าที่ยังไม่มีคอลัมน์นี้ val(8) จะว่างเปล่า — ไม่พังอะไร แค่การ์ดจะไม่โชว์ป้ายรหัส
        code: String(val(8) || '').trim()
      };
    }).filter(function (r) { return r.name; });

    // สินค้าชื่อ+ประเภทเดียวกัน แต่มาจากคนละ "ไอดี" (คนละแถวในชีต Stock) ถูกรวมเป็นชิ้นเดียวกันตรงนี้
    // เสมอ — จำนวนคงเหลือถูกบวกรวมกัน ส่วนราคาถ้าแต่ละไอดีตั้งไว้ไม่เท่ากัน จะเก็บเป็นช่วง (min/max)
    // แล้วไปโชว์เป็น "50-70 บาท" แทนตัวเลขเดียว
    var map = {};
    var order = [];
    rows.forEach(function (r) {
      var key = r.name + '|' + r.variant;
      if (!map[key]) {
        map[key] = { name: r.name, variant: r.variant, qty: 0, threshold: r.threshold, photoUrl: r.photoUrl, minPrice: null, maxPrice: null, code: r.code };
        order.push(key);
      }
      map[key].qty += r.qty;
      if (!map[key].photoUrl && r.photoUrl) map[key].photoUrl = r.photoUrl;
      // ชื่อ+ชนิดเดียวกันได้รหัสเดียวกันเสมออยู่แล้ว (ดู ensureProductCode ในแอปจัดการร้าน) แต่เผื่อไว้ —
      // ถ้าแถวแรกที่เจอดันไม่มีรหัส (ของเก่าก่อนอัปเดต) ก็ยังรับรหัสจากแถวถัดไปได้
      if (!map[key].code && r.code) map[key].code = r.code;
      if (r.price > 0) {
        if (map[key].minPrice === null || r.price < map[key].minPrice) map[key].minPrice = r.price;
        if (map[key].maxPrice === null || r.price > map[key].maxPrice) map[key].maxPrice = r.price;
      }
    });
    return order.map(function (k) { return map[k]; })
      .sort(function (a, b) { return a.name.localeCompare(b.name, 'th'); });
  }

  var allItems = [];

  function populateTypeSelect(items) {
    var select = document.getElementById('typeSelect');
    var current = select.value;
    var types = [];
    var seen = {};
    items.forEach(function (it) {
      var v = it.variant;
      if (v && !seen[v]) { seen[v] = true; types.push(v); }
    });
    types.sort(function (a, b) { return a.localeCompare(b, 'th'); });
    select.innerHTML = '<option value="">ทุกประเภท</option>' +
      types.map(function (v) {
        return '<option value="' + escapeAttr(v) + '">' + escapeHtml(v) + '</option>';
      }).join('');
    if (current && seen[current]) select.value = current;
  }

  function renderLoading() {
    document.getElementById('root').innerHTML =
      '<div class="loading-state"><div class="scan"></div>กำลังโหลดรายการสินค้า...</div>';
    document.getElementById('statusLine').textContent = '';
  }

  function renderError(title, detail) {
    document.getElementById('root').innerHTML =
      '<div class="error-state">' + escapeHtml(title) +
      (detail ? '<code>' + escapeHtml(detail) + '</code>' : '') + '</div>';
  }

  function renderCatalog(items) {
    allItems = items;
    populateTypeSelect(items);
    var searchInput = document.getElementById('searchInput');
    var onlyInStock = document.getElementById('onlyInStock');
    var typeSelect = document.getElementById('typeSelect');
    var sortSelect = document.getElementById('sortSelect');
    searchInput.addEventListener('input', draw);
    onlyInStock.addEventListener('change', draw);
    typeSelect.addEventListener('change', draw);
    sortSelect.addEventListener('change', draw);
    draw();
  }

  function draw() {
    var q = document.getElementById('searchInput').value.trim().toLowerCase();
    var onlyStock = document.getElementById('onlyInStock').checked;
    var typeFilter = document.getElementById('typeSelect').value;
    var sortMode = document.getElementById('sortSelect').value;
    var filtered = allItems.filter(function (it) {
      if (onlyStock && it.qty <= 0) return false;
      if (typeFilter && it.variant !== typeFilter) return false;
      if (q && it.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    filtered = filtered.slice().sort(function (a, b) {
      // สินค้าหมด (qty <= 0) ให้ขึ้นก่อนเสมอ ไม่ว่าจะเรียงด้วยโหมดไหน
      var aOut = a.qty <= 0, bOut = b.qty <= 0;
      if (aOut !== bOut) return aOut ? -1 : 1;

      if (sortMode === 'price_asc' || sortMode === 'price_desc') {
        var pa = avgPrice(a), pb = avgPrice(b);
        if (pa === null && pb === null) return a.name.localeCompare(b.name, 'th');
        if (pa === null) return 1;   // ไม่มีราคา -> ไปท้ายสุดเสมอ
        if (pb === null) return -1;
        return sortMode === 'price_asc' ? pa - pb : pb - pa;
      }
      // trending (ค่าเริ่มต้น): เรียงตามยอดขายจากชีต Orders มาก -> น้อย, เท่ากันเรียงตามชื่อ
      var ta = trendingMap[a.name] || 0;
      var tb = trendingMap[b.name] || 0;
      if (ta !== tb) return tb - ta;
      return a.name.localeCompare(b.name, 'th');
    });

    document.getElementById('statusLine').textContent =
      filtered.length + ' รายการ' + (allItems.length !== filtered.length ? ' (จากทั้งหมด ' + allItems.length + ')' : '');

    var root = document.getElementById('root');
    if (!filtered.length) {
      root.innerHTML = '<div class="empty-state">ไม่พบสินค้าที่ค้นหา</div>';
      return;
    }

    var itemsByKey = {};
    filtered.forEach(function (it, i) { itemsByKey[i] = it; });
    root.innerHTML = '<div class="grid">' + filtered.map(function (it, i) { return cardHtml(it, i); }).join('') + '</div>';
    root.querySelectorAll('.card').forEach(function (el) {
      el.addEventListener('click', function () {
        var it = itemsByKey[el.getAttribute('data-key')];
        if (it) openModal(it);
      });
    });
  }

  function fmtNumber(n) {
    return Number(n).toLocaleString('th-TH', { maximumFractionDigits: 0 });
  }

  // ไม่มีไอดีไหนตั้งราคาไว้เลย -> คืนค่าว่าง (ไม่โชว์ราคา)
  // ทุกไอดีตั้งราคาเท่ากัน -> โชว์ตัวเลขเดียว เช่น "60 บาท"
  // ไอดีตั้งราคาไม่เท่ากัน -> โชว์เป็นช่วง เช่น "50-70 บาท"
  // ใช้ค่าเฉลี่ยของช่วงราคา (min/max) เป็นตัวแทนราคาไว้เรียง — สินค้าที่ไม่มีราคาเลย
  // จะถูกจัดไว้ท้ายสุดเสมอไม่ว่าจะเรียงทิศทางไหน (จัดการใน draw())
  function avgPrice(it) {
    if (it.minPrice === null) return null;
    return (it.minPrice + it.maxPrice) / 2;
  }

  function priceLabel(it) {
    if (it.minPrice === null) return '';
    if (it.minPrice === it.maxPrice) return fmtNumber(it.minPrice) + ' บาท';
    return fmtNumber(it.minPrice) + '-' + fmtNumber(it.maxPrice) + ' บาท';
  }

  function cardHtml(it, key) {
    var isOut = it.qty <= 0;
    var isLow = !isOut && it.threshold != null && it.qty <= it.threshold;
    var qtyClass = isOut ? 'qty-out' : (isLow ? 'qty-low' : 'qty-in');
    var dots = [0, 1, 2].map(function (i) {
      var on = !isOut && i < Math.min(3, it.qty);
      return '<span class="dot' + (on ? ' on' + (isLow ? ' low' : '') : '') + '"></span>';
    }).join('');
    var thumb = it.photoUrl
      ? '<img src="' + escapeAttr(it.photoUrl) + '" alt="' + escapeAttr(it.name) + '" loading="lazy">'
      : '';
    return (
      '<div class="card' + (isOut ? ' out' : '') + '" data-key="' + escapeAttr(key) + '">' +
        '<div class="thumb' + (thumb ? '' : ' empty') + '">' +
          (it.variant ? '<span class="variant-pill">' + escapeHtml(it.variant) + '</span>' : '') +
          thumb +
          (isOut ? '<span class="stamp-out small">หมด</span>' : '') +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-name">' + escapeHtml(it.name) + '</div>' +
          (it.code ? '<div class="card-code">รหัส ' + escapeHtml(it.code) + '</div>' : '') +
          (priceLabel(it) ? '<div class="card-price">' + escapeHtml(priceLabel(it)) + '</div>' : '') +
          '<div class="qty-row">' +
            '<div>' +
              '<div class="qty-readout ' + qtyClass + '">' + (isOut ? 'หมด' : it.qty) + '</div>' +
              '<div class="qty-label">คงเหลือ</div>' +
            '</div>' +
            '<div class="dots">' + dots + '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function openModal(it) {
    var isOut = it.qty <= 0;
    var isLow = !isOut && it.threshold != null && it.qty <= it.threshold;
    var qtyClass = isOut ? 'qty-out' : (isLow ? 'qty-low' : 'qty-in');
    var photo = it.photoUrl
      ? '<img src="' + escapeAttr(it.photoUrl) + '" alt="' + escapeAttr(it.name) + '">'
      : '';
    var modalRoot = document.getElementById('modalRoot');
    modalRoot.innerHTML =
      '<div class="modal-backdrop" id="modalBackdrop">' +
        '<div class="modal-sheet" role="dialog" aria-modal="true">' +
          '<div class="modal-photo-wrap' + (photo ? '' : ' empty') + '">' +
            '<button class="modal-close" id="modalClose" aria-label="ปิด">&#10005;</button>' +
            photo +
            (isOut ? '<span class="stamp-out">หมด</span>' : '') +
          '</div>' +
          '<div class="modal-body">' +
            (it.variant ? '<div class="modal-variant-pill">' + escapeHtml(it.variant) + '</div>' : '') +
            '<h2 class="modal-name">' + escapeHtml(it.name) + '</h2>' +
            (it.code ? (
              '<div class="modal-stat-row">' +
                '<span class="modal-stat-label">รหัสสินค้า</span>' +
                '<span class="modal-stat-value modal-code">' + escapeHtml(it.code) + '</span>' +
              '</div>'
            ) : '') +
            (priceLabel(it) ? (
              '<div class="modal-stat-row">' +
                '<span class="modal-stat-label">ราคา</span>' +
                '<span class="modal-stat-value price">' + escapeHtml(priceLabel(it)) + '</span>' +
              '</div>'
            ) : '') +
            '<div class="modal-stat-row">' +
              '<span class="modal-stat-label">จำนวนคงเหลือ</span>' +
              '<span class="modal-stat-value ' + qtyClass + '">' + (isOut ? 'หมด' : it.qty + ' ตัว') + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', function (e) {
      if (e.target.id === 'modalBackdrop') closeModal();
    });
    document.addEventListener('keydown', onModalKeydown);
  }

  function closeModal() {
    document.getElementById('modalRoot').innerHTML = '';
    document.removeEventListener('keydown', onModalKeydown);
  }

  function onModalKeydown(e) {
    if (e.key === 'Escape') closeModal();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }
})();
</script>

</body>
</html>
